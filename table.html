<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"/>
<title>HOD · Table Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --black:#0A0A0A;--card:#141414;--surface:#1F1F1F;
  --gold:#F2C744;--red:#B83227;--red-deep:#7a1f17;
  --text:#F5F1E8;--muted:#9A9A9A;
  --fp:'Playfair Display',serif;--fs:'Space Grotesk',sans-serif;
}
html,body{background:var(--black);color:var(--text);font-family:var(--fs);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:0;}
button{font-family:var(--fs);cursor:pointer;border:none;outline:none;}
input{font-family:var(--fs);outline:none;}
input::placeholder{color:#666;}
/* Header */
.hd{background:#000;border-bottom:2px solid var(--red);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hd-brand{font-family:var(--fp);font-size:22px;font-weight:900;color:var(--gold);letter-spacing:3px;}
.hd-table{font-size:11px;font-weight:900;color:var(--text);letter-spacing:1.5px;background:rgba(242,199,68,.12);padding:5px 10px;border-radius:6px;border:1px solid rgba(242,199,68,.3);}
.hd-call{background:var(--red);color:var(--gold);padding:8px 14px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;}
/* Form gate */
.gate-wrap{padding:22px 20px 90px;max-width:460px;margin:0 auto;}
/* Venue address card — red/yellow split, sits ABOVE the welcome (Khushi 28-May v3.139.1) */
.gate-venue{background:linear-gradient(135deg,#B83227 0%,#7a1f17 70%,#1a0a08 100%);border:2px solid var(--gold);border-radius:14px;padding:16px 18px;margin-bottom:22px;text-align:center;box-shadow:0 6px 24px rgba(184,50,39,.32);}
.gate-venue .gv-brand{font-family:var(--fp);font-size:30px;font-weight:900;color:var(--gold);letter-spacing:6px;line-height:1;}
.gate-venue .gv-tag{font-size:11px;font-weight:900;color:#FFE9A8;letter-spacing:2.2px;text-transform:uppercase;margin-top:4px;}
.gate-venue .gv-addr{font-size:12px;font-weight:600;color:#fff;letter-spacing:.5px;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(242,199,68,.45);}
.gate-title{font-family:var(--fp);font-size:32px;font-weight:900;color:var(--gold);margin-bottom:8px;letter-spacing:.5px;line-height:1.15;}
.gate-sub{font-size:15px;color:#D8D2C2;margin-bottom:26px;line-height:1.55;font-weight:500;}
.gate-tablebadge{display:inline-block;padding:10px 18px;background:rgba(184,50,39,.22);border:2px solid var(--red);border-radius:10px;color:var(--gold);font-size:16px;font-weight:900;letter-spacing:2.5px;margin-bottom:22px;}
.gate-field{margin-bottom:18px;}
.gate-label{display:block;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:9px;}
.gate-input{width:100%;padding:17px 18px;background:#0A0A0A;border:2px solid rgba(242,199,68,.35);border-radius:12px;color:var(--text);font-size:18px;font-weight:600;transition:border-color .15s;}
.gate-input::placeholder{font-size:15px;color:#666;}
.gate-input:focus{border-color:var(--gold);}
.gate-input.err{border-color:var(--red);}
.gate-btn{width:100%;margin-top:10px;padding:20px;background:var(--gold);color:#0A0A0A;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;box-shadow:0 6px 22px rgba(242,199,68,.35);}
.gate-btn:active{transform:scale(.98);}
.gate-btn:disabled{opacity:.4;}
.gate-foot{margin-top:18px;text-align:center;font-size:12px;color:#777;letter-spacing:.5px;line-height:1.5;}
/* Customer strip — top-LEFT vertical list (Khushi 28-May v3.139.1: "make sure its like list on top left") */
.cust-strip{background:linear-gradient(135deg,#B83227 0%,#7a1f17 60%,#1a0a08 100%);border-bottom:1.5px solid var(--gold);padding:12px 14px;display:flex;align-items:flex-start;gap:12px;}
.cust-strip .cs-tbl{font-family:var(--fs);font-size:16px;font-weight:900;color:var(--gold);letter-spacing:1.5px;padding:7px 12px;border:1.5px solid var(--gold);border-radius:8px;background:rgba(0,0,0,.35);flex-shrink:0;line-height:1;align-self:flex-start;}
.cust-strip .cs-list{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.cust-strip .cs-fld{display:flex;align-items:baseline;gap:8px;line-height:1.15;min-width:0;}
.cust-strip .cs-lbl{font-size:10px;font-weight:900;letter-spacing:1.4px;color:rgba(242,199,68,.85);text-transform:uppercase;flex-shrink:0;min-width:48px;}
.cust-strip .cs-val{font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Menu */
.menu-wrap{padding:14px 14px 220px;}
/* Search — exact mirror of wallet .wv-search (index.html line 5518) */
.menu-search{width:100%;padding:14px 16px;border-radius:12px;background:#0A0A0A;border:2px solid rgba(242,199,68,.45);color:var(--text);font-size:14px;font-weight:600;font-family:var(--fs);outline:none;box-sizing:border-box;letter-spacing:.3px;margin-bottom:12px;-webkit-appearance:none;}
.menu-search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,199,68,.12);}
.menu-search::placeholder{color:rgba(245,241,232,.5);}
.menu-tabs{display:flex;gap:8px;margin-bottom:14px;}
.menu-tab{flex:1;padding:14px 6px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;border:2px solid var(--gold);background:transparent;color:var(--text);transition:all .15s;}
.menu-tab.on{background:var(--gold);border-color:var(--gold);color:#0A0A0A;}
/* Subchip — exact mirror of wallet .wv-subchip (index.html line 5559) */
.menu-subrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px;padding:0 4px;}
.menu-subchip{padding:7px 12px;border-radius:6px;background:transparent;border:1px solid rgba(242,199,68,.45);color:rgba(245,241,232,.85);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;font-family:var(--fs);transition:all .12s;}
.menu-subchip.on{border-color:var(--gold);color:var(--gold);background:rgba(242,199,68,.08);box-shadow:0 0 0 1px rgba(242,199,68,.4);}
/* Order summary card — shows selected items with +/- ABOVE place button */
.cart-card{background:#141414;border:1.5px solid rgba(242,199,68,.4);border-radius:14px;margin:18px 0 14px;padding:14px 16px;}
.cart-card .cc-h{font-family:var(--fp);font-size:16px;font-weight:900;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.cart-card .cc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed rgba(242,199,68,.18);}
.cart-card .cc-row:first-of-type{border-top:none;}
.cart-card .cc-name{flex:1;font-size:12px;font-weight:800;color:var(--text);letter-spacing:.3px;text-transform:uppercase;}
.cart-card .cc-px{font-size:11px;color:rgba(245,241,232,.6);font-weight:700;margin-top:2px;}
.cart-card .cc-total{margin-top:12px;padding-top:12px;border-top:1.5px solid rgba(242,199,68,.3);display:flex;justify-content:space-between;font-size:14px;font-weight:900;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;}
.cart-card .cc-total b{font-family:var(--fs);font-size:18px;font-weight:900;}
.menu-section{font-family:var(--fp);font-size:18px;font-weight:900;color:var(--text);margin:10px 0 14px;letter-spacing:.5px;}
.item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px;border-bottom:1px dashed rgba(184,50,39,.22);}
.item-name{font-size:13px;font-weight:800;color:var(--text);letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;}
.item-price{font-size:15px;font-weight:900;color:var(--gold);margin-top:6px;letter-spacing:.3px;}
.veg-dot{width:11px;height:11px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;flex-shrink:0;}
.veg-dot::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;display:block;}
.add-btn{padding:9px 22px;background:var(--red);color:var(--gold);border-radius:10px;font-size:13px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--red);box-shadow:0 2px 10px rgba(184,50,39,.35);}
.add-btn:active{transform:scale(.96);}
.qctl{display:flex;align-items:center;gap:10px;}
.qbtn{width:32px;height:32px;border-radius:8px;background:#1F1F1F;border:1.5px solid var(--red);color:var(--gold);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.qspan{font-size:15px;font-weight:900;color:var(--gold);min-width:22px;text-align:center;}
/* Place order sticky */
.place-bar{position:fixed;left:0;right:0;bottom:0;z-index:200;padding:14px;background:linear-gradient(180deg,transparent,#000 30%);}
.place-btn{width:100%;padding:18px;background:var(--gold);color:#0A0A0A;border-radius:14px;font-size:15px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 6px 22px rgba(242,199,68,.32);display:flex;align-items:center;justify-content:space-between;padding-left:22px;padding-right:22px;}
.place-btn:disabled{opacity:.4;}
.place-amt{font-family:var(--fs);font-size:18px;font-weight:900;letter-spacing:.5px;}
.place-btn.empty{background:rgba(242,199,68,.18);color:rgba(242,199,68,.7);box-shadow:none;border:2px dashed rgba(242,199,68,.4);}
.place-hint{font-size:11px;font-weight:700;letter-spacing:.5px;color:rgba(242,199,68,.85);text-transform:none;}
.empty-msg{text-align:center;padding:60px 16px;color:var(--muted);font-size:13px;}
/* Overlay popups */
.ovr{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.ovr-card{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:28px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(242,199,68,.25);}
.ovr-icon{font-size:48px;margin-bottom:12px;}
.ovr-title{font-family:var(--fp);font-size:22px;font-weight:900;color:var(--gold);margin-bottom:10px;letter-spacing:.5px;}
.ovr-msg{font-size:14px;color:var(--text);line-height:1.55;margin-bottom:22px;}
.ovr-btn{width:100%;padding:16px;background:var(--gold);color:#0A0A0A;border-radius:12px;font-size:14px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;}
.ovr-btn-sec{background:transparent;color:var(--gold);border:1.5px solid var(--gold);margin-top:10px;}
.err-overlay .ovr-card{border-color:var(--red);}
.err-overlay .ovr-title{color:var(--red);}
/* Invalid table */
.invalid{padding:60px 24px;text-align:center;}
.invalid h1{font-family:var(--fp);font-size:28px;color:var(--red);margin-bottom:14px;}
.invalid p{color:var(--muted);font-size:14px;line-height:1.6;}
</style>
</head>

    var c = document.getElementById("content");
    var TABS = [["food","Food"],["liquor","Liquor"],["nab","NAB"],["smoke","Smoke"]];
    var tabsHtml = TABS.map(function(t){
      return '<button class="menu-tab'+(t[0]===activeTab?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
    }).join("");
    // 👤 Customer strip — TABLE + NAME + PHONE + EMAIL shown FIRST (Khushi spec).
    var emailHtml = (customer.email||"").trim()
      ? '<div class="cs-fld"><div class="cs-lbl">Email</div><div class="cs-val">'+esc(customer.email)+'</div></div>'
      : '';
    c.innerHTML = ''
      + '<div class="cust-strip">'
      +   '<div class="cs-tbl">'+esc(TID)+'</div>'
      +   '<div class="cs-list">'
      +     '<div class="cs-fld"><div class="cs-lbl">Guest</div><div class="cs-val">'+esc(customer.name)+'</div></div>'
      +     '<div class="cs-fld"><div class="cs-lbl">Phone</div><div class="cs-val">'+esc(customer.phone)+'</div></div>'
      +     emailHtml
      +   '</div>'
      + '</div>'
      + '<div class="menu-wrap">'
      +   '<input id="menu-search" class="menu-search" type="search" placeholder="🔍 Search menu — food, drinks, brands…" autocomplete="off"/>'
      +   '<div class="menu-tabs">'+tabsHtml+'</div>'
      +   '<div id="menu-body"></div>'
      +   '<div id="cart-mount"></div>'
      + '</div>'
      + '<div id="place-mount"></div>';
    c.querySelectorAll(".menu-tab").forEach(function(b){
      b.onclick = function(){ activeTab = b.getAttribute("data-tab"); activeSub = 0; menuQuery = ""; renderMenu(); };
    });
    var srch = document.getElementById("menu-search");
    srch.value = menuQuery;
    srch.oninput = function(){ menuQuery = srch.value; renderMenuBody(); };
    renderMenuBody();
    renderCartCard();
    renderPlaceBar();
  }

  function renderMenuBody(){
    var body = document.getElementById("menu-body");
    if (!body) return;
    var cats = menuData[activeTab] || [];
    // Drop OOS-only categories (override-driven + item.oos field).
    var visible = [];
    cats.forEach(function(c){
      var items = (c.items||[]).filter(function(it){
        if (it && it.oos === true) return false;
        var ov = ovFor(it.n); return !(ov && ov.outOfStock);
      });
      if (items.length) visible.push({ cat: c.cat, items: items });
    });
    // 🔍 Search applies AFTER OOS filter, scoped to active tab (matches wallet line 6005).
    var filtered = menuQuery.trim() ? filterMenu(visible, menuQuery) : visible;
    if (!filtered.length) {
      var msg = menuQuery.trim()
        ? 'No items match "'+esc(menuQuery)+'".<br/>Try a different word, or clear the search.'
        : 'No items in this section yet.<br/>Try another tab above.';
      body.innerHTML = '<div class="empty-msg">'+msg+'</div>';
      return;
    }
    if (activeSub >= filtered.length) activeSub = 0;
    var subHtml = filtered.map(function(c,i){
      return '<button class="menu-subchip'+(i===activeSub?' on':'')+'" data-sub="'+i+'">'+esc(c.cat)+'</button>';
    }).join("");
    var section = filtered[activeSub];
    var rowsHtml = section.items.map(function(it){
      var key = section.cat+"|"+it.n;
      var qty = cart[key] ? cart[key].qty : 0;
      var price = effPrice(it.n, it.p);
      var hasDisc = price !== it.p;
      var priceHtml = hasDisc
        ? '<span style="text-decoration:line-through;color:rgba(255,255,255,.35);margin-right:6px;">\u20b9'+it.p+'</span><span class="item-price" style="display:inline;">\u20b9'+price+'</span>'
        : '<span class="item-price" style="display:inline;">\u20b9'+it.p+'</span>';
      var veg = "";
      if (typeof it.v !== "undefined") {
        var col = it.v === true ? "#00C864" : "#EF4444";
        veg = '<span class="veg-dot" style="color:'+col+';"></span>';
      }
      var ctrl;
      if (qty === 0) {
        ctrl = '<button class="add-btn" data-act="add" data-key="'+esc(key)+'">Add +</button>';
      } else {
        ctrl = '<div class="qctl">'
          + '<button class="qbtn" data-act="dec" data-key="'+esc(key)+'">−</button>'
          + '<span class="qspan">'+qty+'</span>'
          + '<button class="qbtn" data-act="inc" data-key="'+esc(key)+'">+</button>'
          + '</div>';
      }
      return '<div class="item-row" data-name="'+esc(it.n)+'">'
        + '<div style="flex:1;min-width:0;">'
        + '<div class="item-name">'+veg+'<span>'+esc(it.n)+'</span></div>'
        + '<div style="margin-top:6px;font-weight:800;">'+priceHtml+'</div>'
        + '</div>'+ctrl+'</div>';
    }).join("");
    body.innerHTML = '<div class="menu-subrow">'+subHtml+'</div>'
      + '<div class="menu-section">'+esc(section.cat)+'</div>'
      + rowsHtml;
    // Wire sub chips
    body.querySelectorAll(".menu-subchip").forEach(function(ch){
      ch.onclick = function(){ activeSub = parseInt(ch.getAttribute("data-sub"),10); renderMenuBody(); };
    });
    // Wire +/-/Add buttons. Look up item across ALL visible (not filtered) cats,
    // so qty updates work even when the user has typed a search (item still in
    // same category, just filtered list).
    body.querySelectorAll("[data-act]").forEach(function(b){
      b.onclick = function(){
        var act = b.getAttribute("data-act"); var key = b.getAttribute("data-key");
        var parts = key.split("|"); var cat = parts[0]; var name = parts.slice(1).join("|");
        var srcCat = visible.find(function(vc){ return vc.cat === cat; });
        var item = srcCat ? srcCat.items.find(function(it){ return it.n === name; }) : null;
        if (!item) return;
        if (act === "add" || act === "inc") {
          if (!cart[key]) cart[key] = { n: name, p: effPrice(name, item.p), cat: cat, qty: 0 };
          cart[key].qty++;
        } else if (act === "dec") {
          if (cart[key]) { cart[key].qty--; if (cart[key].qty <= 0) delete cart[key]; }
        }
        renderMenuBody(); renderCartCard(); renderPlaceBar();
      };
    });
  }

  function cartTotal(){ var t=0,c=0; Object.keys(cart).forEach(function(k){ t += (cart[k].p||0)*cart[k].qty; c += cart[k].qty; }); return {total:t, count:c}; }

  // 🛒 Order summary card — selected items with +/-, ABOVE the place button
  // (Khushi spec: "ONCE THEY SELECT THE ITEMS IT SHOWULD SHOW BELOW WITH + AND -").
  function renderCartCard(){
    var mount = document.getElementById("cart-mount");
    if (!mount) return;
    var t = cartTotal();
    if (t.count === 0) { mount.innerHTML = ""; return; }
    var rows = Object.keys(cart).map(function(k){
      var it = cart[k];
      return '<div class="cc-row">'
        + '<div style="flex:1;min-width:0;">'
        +   '<div class="cc-name">'+esc(it.n)+'</div>'
        +   '<div class="cc-px">\u20b9'+it.p+' × '+it.qty+' = \u20b9'+(it.p*it.qty)+'</div>'
        + '</div>'
        + '<div class="qctl">'
        +   '<button class="qbtn" data-cact="dec" data-ckey="'+esc(k)+'">−</button>'
        +   '<span class="qspan">'+it.qty+'</span>'
        +   '<button class="qbtn" data-cact="inc" data-ckey="'+esc(k)+'">+</button>'
        + '</div>'
        + '</div>';
    }).join("");
    mount.innerHTML = '<div class="cart-card">'
      + '<div class="cc-h"><span>🛒 Your Order</span><span style="font-size:11px;color:rgba(245,241,232,.6);">'+t.count+' item'+(t.count===1?'':'s')+'</span></div>'
      + rows
      + '<div class="cc-total"><span>Total</span><b>\u20b9'+t.total+'</b></div>'
      + '</div>';
    mount.querySelectorAll("[data-cact]").forEach(function(b){
      b.onclick = function(){
        var act = b.getAttribute("data-cact"); var key = b.getAttribute("data-ckey");
        if (!cart[key]) return;
        if (act === "inc") cart[key].qty++;
        else if (act === "dec") { cart[key].qty--; if (cart[key].qty <= 0) delete cart[key]; }
        renderMenuBody(); renderCartCard(); renderPlaceBar();
      };
    });
  }

  // 🆕 v3.139.2 (Khushi 28-May) — ALWAYS render the place bar, NEVER disabled.
  // When cart is empty, tap shows a friendly "Add items first" popup so the
  // customer isn't confused why nothing happened. Once items added, button
  // turns full gold + shows count + total.
  function renderPlaceBar(){
    var mount = document.getElementById("place-mount");
    if (!mount) return;
    var t = cartTotal();
    if (t.count === 0) {
      mount.innerHTML = '<div class="place-bar">'
        + '<button class="place-btn" id="place-go-empty" style="background:var(--gold);color:#0A0A0A;">'
        +   '<span>📋 Place Order</span>'
        +   '<span class="place-amt">Tap when ready</span>'
        + '</button></div>';
      document.getElementById("place-go-empty").onclick = function(){
        showOverlay({
          icon:"🛒", title:"Add items first",
          msg:"Please <b>add items to your order</b> by tapping the red <b>ADD +</b> buttons on the menu.<br/><br/>Once you've picked what you'd like, tap PLACE ORDER again.",
          btn:"OK, got it"
        });
      };
      return;
    }
    mount.innerHTML = '<div class="place-bar">'
      + '<button class="place-btn" id="place-go">'
      + '<span>📋 Place Order · '+t.count+' item'+(t.count===1?'':'s')+'</span>'
      + '<span class="place-amt">\u20b9'+t.total+'</span>'
      + '</button></div>';
    document.getElementById("place-go").onclick = onPlaceOrder;
  }

  // ═══ PLACE ORDER ═══
  function onPlaceOrder(){
    var btn = document.getElementById("place-go");
    if (btn) { btn.disabled = true; btn.style.opacity = ".6"; }
    var items = Object.keys(cart).map(function(k){
      return { name: cart[k].n, qty: cart[k].qty, price: cart[k].p, category: cart[k].cat };
    });
    writeRequest("place_order", items).then(function(ok){
      if (btn) { btn.disabled = false; btn.style.opacity = ""; }
      if (ok) {
        cart = {};
        renderMenuBody(); renderCartCard(); renderPlaceBar();
        showOverlay({
          icon:"🛎", title:"Captain on the way!",
          msg:"Your order has been sent. <b>Captain will be with you shortly...</b><br/><br/>Please wait at <b>TABLE "+esc(TID)+"</b>.",
          btn:"OK"
        });
      } else {
        showOverlay({
          icon:"⚠️", title:"Couldn't reach captain",
          msg:"Network slow or App Check blocked us.<br/>Please <b>wave to a staff member</b> or tap the CALL WAITER button at the top.",
          btn:"OK", err:true
        });
      }
    });
  }

  // ═══ CALL WAITER ═══
  function callWaiter(){
    if (!customer) { alert("Please fill in your details first."); return; }
    writeRequest("call_waiter", []).then(function(ok){
      showOverlay({
        icon: ok ? "🛎" : "⚠️",
        title: ok ? "Waiter on the way!" : "Couldn't send",
        msg: ok
          ? "We've alerted our staff. Someone will be at <b>TABLE "+esc(TID)+"</b> in a moment."
          : "Try again, or wave to a staff member.",
        btn:"OK", err: !ok
      });
    });
  }
  window.HOD_TABLE = { callWaiter: callWaiter };

  // ═══ FIRESTORE WRITER ═══
  function writeRequest(type, items){
    return new Promise(function(resolve){
      if (!db) return resolve(false);
      var payload = {
        tableId: TID,
        type: type,
        customerName: customer.name,
        customerPhone: customer.phone,
        customerEmail: customer.email || "",
        items: (items||[]).slice(0,40).map(function(it){
          return {
            name: String(it.name||"").slice(0,80),
            qty: Math.max(1, Math.min(99, Number(it.qty)||1)),
            price: typeof it.price === "number" ? it.price : null,
            category: it.category || ""
          };
        }).filter(function(it){ return it.price !== null || true; }).map(function(it){
          // Strip null price for Firestore (no `null` numbers — drop key instead).
          var o = { name: it.name, qty: it.qty, category: it.category };
          if (typeof it.price === "number") o.price = it.price;
          return o;
        }),
        status: "pending",
        createdAt: new Date().toISOString(),
        operationalNight: operationalNightStr(),
        acknowledgedBy: null,
        acknowledgedAt: null
      };
      db.collection(TABLE_CALL_COL).add(payload)
        .then(function(){ resolve(true); })
        .catch(function(err){ console.warn("[writeRequest] failed", err); resolve(false); });
    });
  }

  // ═══ OVERLAY POPUP ═══
  function showOverlay(opts){
    var ovr = document.createElement("div");
    ovr.className = "ovr" + (opts.err ? " err-overlay" : "");
    ovr.innerHTML = '<div class="ovr-card">'
      + '<div class="ovr-icon">'+esc(opts.icon||"")+'</div>'
      + '<div class="ovr-title">'+esc(opts.title||"")+'</div>'
      + '<div class="ovr-msg">'+(opts.msg||"")+'</div>'
      + '<button class="ovr-btn">'+esc(opts.btn||"OK")+'</button>'
      + '</div>';
    document.body.appendChild(ovr);
    ovr.querySelector(".ovr-btn").onclick = function(){ ovr.remove(); };
    ovr.onclick = function(e){ if (e.target === ovr) ovr.remove(); };
  }

  // ═══ RESTORE CUSTOMER FROM SESSION (so reload doesn't re-ask) ═══
  try {
    var saved = sessionStorage.getItem("hod_tbl_cust_"+TID);
    if (saved) {
      customer = JSON.parse(saved);
      loadMenu(function(m){ menuData = m; render(); });
    } else {
      render();
    }
  } catch(e){ render(); }

})();
</script>
</body>
</html>

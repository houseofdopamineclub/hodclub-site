<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="only light" />
  <meta name="description" content="House of Dopamine Koramangala food and drink menu." />
  <meta name="robots" content="index,follow" />
  <title>HOD — Food &amp; Drink Menu</title>
  <style>
    * { box-sizing: border-box; }
    :root { --bg:#F4F4F0; --ink:#000; --pink:#FF90E8; --green:#23A094; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:Inter,Arial,sans-serif; }
    body { padding: max(14px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); }
    .shell { width:min(100%, 1040px); margin:0 auto; }
    header {
      display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
      margin-bottom:12px; padding:14px 16px; background:#fff; border:2px solid var(--ink);
      border-radius:12px; box-shadow:4px 4px 0 var(--ink);
    }
    h1 { margin:0; font-size:clamp(20px,4vw,30px); font-weight:900; letter-spacing:-.5px; }
    .sub { margin-top:4px; color:#555; font-size:12px; font-weight:700; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .button {
      display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:9px 14px;
      border:2px solid var(--ink); border-radius:8px; color:var(--ink); background:var(--pink);
      text-decoration:none; font-size:12px; font-weight:900; box-shadow:2px 2px 0 var(--ink);
    }
    .button.secondary { background:#fff; }
    .viewer {
      width:100%; height:calc(100vh - 128px); min-height:620px; display:block; background:#fff;
      border:2px solid var(--ink); border-radius:12px; box-shadow:4px 4px 0 var(--ink);
    }
    .fallback {
      display:none; padding:36px 18px; text-align:center; background:#fff; border:2px solid var(--ink);
      border-radius:12px; font-weight:800;
    }
    footer { padding:16px 4px 0; text-align:center; color:#555; font-size:11px; font-weight:700; }
    footer a { color:inherit; font-weight:900; }
    @media (max-width:640px) {
      body { padding-left:10px; padding-right:10px; }
      header { padding:12px; box-shadow:3px 3px 0 var(--ink); }
      .actions { width:100%; }
      .button { flex:1; }
      .viewer { height:calc(100vh - 182px); min-height:520px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>H.O.D — FOOD &amp; DRINK MENU</h1>
        <div class="sub">HOUSE OF DOPAMINE · KORAMANGALA</div>
      </div>
      <div class="actions">
        <a class="button" href="./HOD-CLUB-FOOD-AND-DRINK.pdf" target="_blank" rel="noopener">OPEN FULL SCREEN</a>
        <a class="button secondary" href="./HOD-CLUB-FOOD-AND-DRINK.pdf" download>DOWNLOAD PDF</a>
      </div>
    </header>
    <object class="viewer" data="./HOD-CLUB-FOOD-AND-DRINK.pdf#view=FitH" type="application/pdf" aria-label="HOD food and drink menu">
      <div class="fallback">
        Your browser cannot show the menu here.<br /><br />
        <a class="button" href="./HOD-CLUB-FOOD-AND-DRINK.pdf" target="_blank" rel="noopener">OPEN MENU PDF</a>
      </div>
    </object>
    <footer>
      Prices shown in the official menu PDF. For same-night availability, call
      <a href="tel:+919686444906">+91 96864 44906</a>.
    </footer>
  </main>
</body>
</html>

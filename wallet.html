<!-- Razorpay checkout.js LAZY-LOADED on first pay tap (verbatim from index.html) -->
<script>(function(){
  var _rzpLoadPromise=null;
  window.ensureRazorpay=function(cb){
    if(typeof window.Razorpay!=='undefined'){ if(cb)cb(true); return; }
    if(!_rzpLoadPromise){
      _rzpLoadPromise=new Promise(function(resolve){
        try{
          var s=document.createElement('script');
          s.src='https://checkout.razorpay.com/v1/checkout.js';
          s.async=true;
          s.onload=function(){ if(typeof window.Razorpay!=='undefined'){ resolve(true); } else { _rzpLoadPromise=null; resolve(false); } };
          s.onerror=function(){ _rzpLoadPromise=null; resolve(false); };
          document.head.appendChild(s);
        }catch(e){ _rzpLoadPromise=null; resolve(false); }
      });
    }
    _rzpLoadPromise.then(function(ok){ if(cb)cb(ok); });
  };
})();</script>

<!-- POS menu overrides (OOS/discount) live listener + getEffectivePrice (verbatim) -->
<script>
var POS_MENU_OVERRIDES = {};
var _menuOvUnsub = null;
function _ovKey(name){
  return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function _ovFor(itemName){ return POS_MENU_OVERRIDES[_ovKey(itemName)] || null; }
function _effPrice(itemName, basePrice){
  var ov = _ovFor(itemName);
  if(!ov) return basePrice;
  if(ov.discountPercent) return Math.max(0, Math.round((basePrice - basePrice*ov.discountPercent/100)*100)/100);
  if(ov.discountAmount)  return Math.max(0, Math.round((basePrice - ov.discountAmount)*100)/100);
  return basePrice;
}
function startMenuOverridesListener(){
  // 🆕 2026-05-26 v3.39 (Khushi: "READS GOING IN MILLIONS, 1M/HR ALONE IN
  // 9-10PM SLOT") — CHANGED from onSnapshot → 30s poll + tab-focus refresh.
  //
  // ROOT CAUSE (corrected — the v3.25 comment under-estimated by ~100×):
  //   onSnapshot fires the FULL COLLECTION READ on every doc change × every
  //   connected client. With staff actively toggling DISC/SC/OOS during an
  //   event (~50-100 toggles/hr) and ~134 customers holding wallets open,
  //   the real math is:
  //     30 docs × 134 customers × 100 toggles/hr = 402,000 reads/hr
  //   The 1M reads in tonight's 9-10pm slot matches this almost exactly.
  //
  // NEW MODEL (poll + foreground rebind):
  //   (a) one-shot get() on page load (immediate prime)
  //   (b) setInterval every 30s while tab is visible
  //   (c) extra get() when customer brings tab to foreground
  //       (visibilitychange — covers "customer puts phone down then picks
  //       up again to order" path, which is the moment they need fresh
  //       OOS/discount state)
  //   (d) pause polling while tab hidden (no background reads)
  //
  // Worst-case math (same load as above):
  //   134 customers × ~5 foreground-returns/hr × 30 docs = 20K reads/hr.
  //   Even with every customer on a busy tab: 134 × 120 polls/hr × 30 = 480K
  //   but realistic active visibility ratio drops it ~80% → ~96K/hr. Still
  //   a 4-5× improvement on the 402K/hr leak, and falls toward 20K/hr the
  //   instant most customers tab away.
  //
  // SAFETY: 30s max staleness is acceptable because the covers/order rules
  // on the POS server reject OOS items at order-time anyway — the customer
  // sees the cart fail with the bartender's reason, then refreshes. Khushi's
  // original "INSTANTLY" requirement (v3.25) was UI nicety, not safety.
  //
  // 🛟 FALLBACK: if firestore.get() fails, POS_MENU_OVERRIDES stays at last
  // good value (or empty on first load) so menu still renders at base prices.
  if(!firestore) return;
  // Idempotency guard — initFirebase() runs twice (immediate + window.load),
  // so without this we'd attach two visibilitychange handlers and double-poll.
  if(window.__hodMenuOvAttached) return;
  window.__hodMenuOvAttached=true;
  var _polling=false, _intervalId=null;
  // 🆕 2026-05-27 v3.103 (Khushi LIVE) — `_liveUnsub` holds the onSnapshot
  // detach handle for the ACTIVE wallet-menu live listener. Attached only
  // while `#wallet-menu-content` is mounted (bar-tab customer browsing menu);
  // detached when they navigate away. While attached, the 30s poll is gated
  // off (would duplicate reads). See `_syncLiveListener` below for lifecycle.
  var _liveUnsub=null;
  var _stopped=false;
  function _menuMounted(){
    try{ return !!document.getElementById('wallet-menu-content'); }
    catch(e){ return false; }
  }
  function _applyOverrides(snap){
    var next={};
    snap.forEach(function(d){ next[d.id] = d.data() || {}; });
    POS_MENU_OVERRIDES = next;
    try{
      var mc = document.getElementById('wallet-menu-content');
      if(mc && typeof window.__rebuildWalletMenu === 'function') window.__rebuildWalletMenu();
    }catch(e){}
  }
  function _refresh(){
    if(_stopped) return;
    if(_polling) return;
    // While live onSnapshot is attached, it's already keeping POS_MENU_OVERRIDES
    // fresh — a parallel get() would just duplicate reads.
    if(_liveUnsub) return;
    // 🆕 2026-05-27 v3.103 — also skip the poll when the wallet menu UI is NOT
    // mounted. Customers on home / events / booking pages never see menu data,
    // so spending reads on them is pure waste. This matches the v3.39 menu-
    // firestore poll's `_menuUiVisible()` gate at line ~810 (same predicate).
    if(!_menuMounted()) return;
    _polling=true;
    try{
      firestore.collection('posMenuOverrides').get().then(function(snap){
        _applyOverrides(snap);
      }).catch(function(err){ console.warn('posMenuOverrides poll error', err); })
        .then(function(){ _polling=false; });
    }catch(e){ _polling=false; console.warn('posMenuOverrides refresh threw', e); }
  }
  function _startPoll(){
    if(_intervalId) return;
    _intervalId = setInterval(function(){
      if(document.visibilityState==='visible') _refresh();
    }, 30000);
  }
  // 🆕 2026-05-27 v3.103 (Khushi LIVE) — INSTANT menu sync while the customer
  // is on the wallet menu page. Khushi LIVE: "menu on wallets are not synching,
  // refresh is required". She toggled an OOS item in admin → expected instant
  // disappearance on the wallet; got nothing until manual refresh.
  //
  // ROOT CAUSE — v3.39's pure-poll model has 30s max staleness AND skips
  // entirely when tab is backgrounded. Two open tabs on the same desktop
  // (admin + wallet) often BOTH stay visible per the browser's
  // visibilityState API, so the visibilitychange foreground-rebind never
  // fires either. Khushi sees stale menu indefinitely until she hits refresh.
  //
  // FIX — re-introduce onSnapshot, but scope its lifetime tightly:
  //   • Attach ONLY when `#wallet-menu-content` is mounted (i.e. customer
  //     is actively browsing the menu; bar-tab patrons only).
  //   • Detach the moment that element is removed (navigation away).
  //   • While attached, the 30s poll is gated off (_refresh no-ops).
  //
  // COST MATH — at peak (~30 wallets simultaneously on the menu page):
  //   30 viewers × 30 docs initial-read = 900 reads (one-time on mount)
  // + 30 viewers × ~10 OOS/disc toggles/hr × 1 delta-doc = 300 reads/hr
  //   = ~1,200 reads/hr total — DRAMATICALLY cheaper than the 30s poll
  //   it replaces (~108K reads/hr at the same viewer count) AND instant.
  //
  // 🛟 FAIL-OPEN — if onSnapshot errors (auth blip, network), POS_MENU_OVERRIDES
  // keeps its last good value and the 30s poll resumes the next tick because
  // _liveUnsub is reset to null in the error path. Customer worst-case sees
  // stale-by-30s menu, not blank menu.
  function _attachLive(){
    if(_stopped) return;
    if(_liveUnsub) return;
    try{
      _liveUnsub = firestore.collection('posMenuOverrides').onSnapshot(
        function(snap){ _applyOverrides(snap); },
        function(err){
          console.warn('posMenuOverrides live listener error', err);
          try{ if(_liveUnsub){ _liveUnsub(); } }catch(e){}
          _liveUnsub = null;
        }
      );
    }catch(e){
      console.warn('posMenuOverrides live attach threw', e);
      _liveUnsub = null;
    }
  }
  function _detachLive(){
    if(!_liveUnsub) return;
    try{ _liveUnsub(); }catch(e){}
    _liveUnsub = null;
  }
  function _syncLiveListener(){
    if(_stopped){ _detachLive(); return; }
    var mounted = _menuMounted();
    var visible = document.visibilityState === 'visible';
    if(mounted && visible){ _attachLive(); }
    else { _detachLive(); }
  }
  // Poll the DOM every 2s — cheap (no Firestore reads), and 2s of menu-mount
  // latency before the live listener attaches is invisible to the customer
  // (they'll see updates from the initial _refresh prime anyway).
  var _liveSyncIv = setInterval(_syncLiveListener, 2000);
  // Also re-sync immediately on visibility change so tab-away detaches the
  // listener instantly (don't pay reads for a backgrounded customer). Store
  // the handler so `_menuOvUnsub` can remove it cleanly (otherwise a retained
  // listener could fan back out and reattach after teardown).
  var _liveVisHandler=null;
  try{
    _liveVisHandler = function(){ _syncLiveListener(); };
    document.addEventListener('visibilitychange', _liveVisHandler);
  }catch(e){}
  function _stopPoll(){
    if(!_intervalId) return;
    clearInterval(_intervalId); _intervalId=null;
  }
  _refresh();      // (a) prime
  _startPoll();    // (b) 30s while visible
  // (c) refresh on foreground return — 🆕 v3.62 — 2s debounce so rapid
  // phone lock/unlock (or iOS Safari's spurious visibility flips) don't
  // fan out to 134 customers × N flips/sec = burst reads. The first flip
  // schedules a single refresh 2s later; subsequent flips inside that
  // window reset the timer. _stopPoll still fires immediately on hide.
  var _visTimer=null;
  try{
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='visible'){
        if(_visTimer){clearTimeout(_visTimer);}
        _visTimer=setTimeout(function(){
          _visTimer=null;
          _refresh();
          _startPoll();
        }, 2000);
      } else {
        if(_visTimer){clearTimeout(_visTimer);_visTimer=null;}
        _stopPoll();   // (d) pause while hidden
      }
    });
  }catch(e){}
  // Keep _menuOvUnsub as a stop handle so future re-init paths don't double up
  _menuOvUnsub = function(){
    _stopped=true;
    _stopPoll();
    _detachLive();
    if(_liveSyncIv){ clearInterval(_liveSyncIv); _liveSyncIv=null; }
    if(_liveVisHandler){
      try{ document.removeEventListener('visibilitychange', _liveVisHandler); }catch(e){}
      _liveVisHandler=null;
    }
  };
}
</script>

<!-- helpers: sanitize, showToast, generateLocalQR (verbatim) -->
<script>
function sanitize(str){return(str||'').replace(/[<>'"&]/g,function(c){return{'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c];});}
function showToast(msg,type,dur){
  var cont=document.getElementById('toast-container');
  if(!cont){cont=document.createElement('div');cont.id='toast-container';cont.className='toast-container';document.body.appendChild(cont);}
  var t=document.createElement('div');t.className='toast toast-'+(type||'social');
  var ic={social:'👀',success:'✅',err:'⚠️',promo:'🎁'};
  t.innerHTML='<span style="font-size:14px">'+(ic[type]||'💬')+'</span><span>'+msg+'</span>';
  cont.appendChild(t);
  var d=dur||3800;
  setTimeout(function(){t.style.animation='toastOut .3s ease forwards';setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},300);},d);
}
function generateLocalQR(elId,data){
  setTimeout(function(){
    var qEl=document.getElementById(elId);
    if(qEl&&typeof QRCode!=='undefined'&&!qEl.hasAttribute('data-qr')){
      qEl.setAttribute('data-qr','1');
      var w=qEl.clientWidth||140, h=qEl.clientHeight||140;
      var sz=Math.max(96,Math.min(w,h)-8);
      new QRCode(qEl,{text:data,width:sz,height:sz,colorDark:'#000000',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M});
    }
  },500);
}
</script>

// Split bar menu into LIQUOR (alcoholic) and NAB (non-alcoholic beverages)
// for the new 4-tab Digitory layout. Returns the menu data for the active
// tab; falls back to BAR for unknown tabs.
function hodGetMenuByTab(tab){
  // 2026-05-13 — guard against ReferenceError when the live-menu Firestore
  // IIFE hasn't finished priming window.HOD_*_MENU yet (the bar globals are
  // assigned in a microtask, and a fast tap on Liquor/NAB/Smoke before that
  // microtask flushes used to throw "HOD_BAR_MENU is not defined" and crash
  // the whole wallet). Reading via window.* + falling back to the baked-in
  // _FALLBACK arrays makes this never throw, regardless of init order.
  var FOOD = (typeof window!=='undefined' && window.HOD_FOOD_MENU) || (typeof HOD_FOOD_MENU_FALLBACK!=='undefined' ? HOD_FOOD_MENU_FALLBACK : []);
  var BAR  = (typeof window!=='undefined' && window.HOD_BAR_MENU)  || (typeof HOD_BAR_MENU_FALLBACK !=='undefined' ? HOD_BAR_MENU_FALLBACK  : []);
  var SMK  = (typeof window!=='undefined' && window.HOD_SMOKE_MENU)|| (typeof HOD_SMOKE_MENU_FALLBACK!=='undefined' ? HOD_SMOKE_MENU_FALLBACK: []);
  if(tab==='food') return _hodApplyLiveCats(FOOD);
  if(tab==='smoke') return _hodApplyLiveCats(SMK);
  var split=[];
  BAR.forEach(function(c){
    var matched=(c.items||[]).filter(function(it){
      var isNab=it.alc===false;
      return tab==='nab' ? isNab : !isNab;
    });
    if(matched.length) split.push({cat:c.cat,items:matched});
  });
  return _hodApplyLiveCats(split);
}
// 2026-06-14 — LIVE MENU CATEGORIES (admin Menu CRM). Mirror of the POS
// filterMenuByLiveCategories so the customer wallet matches Bar + Captain:
// when 1+ categories are toggled LIVE, the customer menu shows ONLY items whose
// name matches a live-category item (with the category discount applied). When
// none are live (or the read fails / rules block it) → full menu (fail-open).
var HOD_LIVE_CATEGORIES=[];
function _hodLiveCatMap(){
  // lowercased item name -> max discount% across the LIVE categories it appears in
  var m={};
  (HOD_LIVE_CATEGORIES||[]).forEach(function(c){
    if(!c||c.isLive!==true) return;
    (c.items||[]).forEach(function(it){
      var k=String((it&&it.name)||'').toLowerCase().trim();
      if(!k) return;
      var d=Number(c.discountPercent||0);
      if(m[k]===undefined||d>m[k]) m[k]=d;
    });
  });
  return m;
}
function _hodApplyLiveCats(menuData){
  try{
    var map=_hodLiveCatMap();
    var keys=Object.keys(map);
    if(keys.length===0) return menuData; // fail-open → full menu
    var out=[];
    (menuData||[]).forEach(function(c){
      var hits=[];
      (c.items||[]).forEach(function(it){
        var k=String((it&&it.n)||'').toLowerCase().trim();
        if(!(k in map)) return;
        var d=map[k];
        if(d>0){ var nit={}; for(var p in it){ if(Object.prototype.hasOwnProperty.call(it,p)) nit[p]=it[p]; } nit.p=Math.round(it.p*(1-d/100)*100)/100; hits.push(nit); }
        else hits.push(it);
      });
      if(hits.length) out.push({cat:c.cat,items:hits});
    });
    return out;
  }catch(e){ return menuData; } // fail-open on any error
}
function _hodLoadLiveCats(){

      try{ if(typeof window.__rebuildWalletMenu==='function') window.__rebuildWalletMenu(); }catch(e){}
    }).catch(function(){ HOD_LIVE_CATEGORIES=[]; /* fail-open: drop filter → full menu */ try{ if(typeof window.__rebuildWalletMenu==='function') window.__rebuildWalletMenu(); }catch(e){} });
  }catch(e){}
}
var HOD_GST_RATE=0.05, HOD_SC_RATE=0.10;
function hodComputeBreakdown(items, discPct, scOn){
  // 🆕 2026-06-07 — DISCOUNT + SC-toggle aware (mirrors the POS
  // computeHodBreakdownAdjusted EXACTLY). With discPct=0 & scOn!==false this is
  // mathematically IDENTICAL to the original (alcohol GST-exempt, 2-decimal
  // SC/GST, single final whole-rupee round) so every existing caller that passes
  // only `items` is unchanged. The bartender's bill-level discount is persisted
  // on the cover (billDiscountPct / billScOn) and passed in ONLY at the
  // final-bill views, so the customer's "VIEW BILL" total matches the bar's bill
  // to the rupee (kills the ₹2,000 bar vs ₹2,105 phone mismatch).
  var foodSub=0, alcSub=0, nonAlcSub=0;
  (items||[]).forEach(function(it){
    var line=(it.p||0)*(it.qty||0);
    var t=it.t||'drink';
    if(t==='food')foodSub+=line;
    else if(it.alc===false)nonAlcSub+=line;
    else alcSub+=line;
  });
  var subtotal=foodSub+alcSub+nonAlcSub;
  var pct=Math.min(100, Math.max(0, discPct||0));
  var factor=(100-pct)/100;
  var dFood=foodSub*factor, dAlc=alcSub*factor, dNonAlc=nonAlcSub*factor;
  var discountedSub=dFood+dAlc+dNonAlc;
  var discount=Math.round((subtotal-discountedSub)*100)/100;
  var scApplied=(scOn===false)?false:true;
  var sc=scApplied?Math.round(discountedSub*HOD_SC_RATE*100)/100:0;
  var gstBase=dFood+dNonAlc+sc; // alcohol is GST-exempt
  var gst=Math.round(gstBase*HOD_GST_RATE*100)/100;
  var cgst=Math.round(gst*50)/100;
  var sgst=Math.round((gst-cgst)*100)/100;
  var raw=discountedSub+sc+gst;
  var grandTotal=Math.round(raw);
  var roundOff=Math.round((grandTotal-raw)*100)/100;
  return {foodSubtotal:foodSub, alcSubtotal:alcSub, nonAlcSubtotal:nonAlcSub,
          drinkSubtotal:alcSub+nonAlcSub, subtotal:subtotal,
          serviceCharge:sc, gst:gst, cgst:cgst, sgst:sgst,
          roundOff:roundOff, grandTotal:grandTotal,
          discount:discount, discountPct:pct};
}
</script>

<!-- ════════ TRIMMED BOOT — initFirebase (no events listener), render, wallet.js loader ════════ -->
<script>
// initFirebase() — IDENTICAL to index.html EXCEPT the events listener is dropped
// (the wallet does not read events, so this avoids extra Firestore reads). App Check
// is still skipped on preview hosts (prevents the reCAPTCHA reload loop), Firestore
// is still forced to long-polling (webview-safe, the core 10-15s→2s fix), and the
// menu-overrides listener + live categories + menu-repaint listener are all kept so
// the order menu behaves exactly as it does on the full site.
function initFirebase(){
  try{
    if(typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes('PASTE')){
      if(!firebase.apps || firebase.apps.length===0){
        firebase.initializeApp(FIREBASE_CONFIG);
        // 🆕 2026-05-28 v3.137 — L1 App Check (reCAPTCHA Enterprise).
        // Must run AFTER initializeApp but BEFORE firestore()/auth() are
        // touched, so the very first request carries an App Check token.
        // 🛟 FAIL-OPEN: if key blank, compat SDK missing, or activate()
        // throws — we swallow and continue. Customer site STILL WORKS,
        // just without the App Check header (= today's state).
        try{
          // 🛟 v3.198 — ROOT-CAUSE FIX for the preview "page keeps reloading" loop.
          // The reCAPTCHA Enterprise key is allow-listed ONLY for the live domain
          // (hodclub.in). On the Replit/dev PREVIEW host (*.replit.dev / localhost)
          // App Check's token auto-refresh REJECTS every ~30-60s
          // (appCheck/recaptcha-error → "cancelled"), and the Replit/Vite dev
          // runtime-error overlay turns each rejection into a full PAGE RELOAD →
          // an endless reload loop while reviewing. Skipping App Check on preview
          // hosts removes the trigger entirely. The LIVE site keeps full App Check.
          var _h=(location.hostname||'').toLowerCase();
          var _isPreviewHost=(_h==='localhost'||_h==='127.0.0.1'||/\.replit\.dev$/.test(_h)||/\.repl\.co$/.test(_h)||/\.replit\.app$/.test(_h));
          if(_isPreviewHost){
            console.log('ℹ️ App Check skipped on preview host ('+_h+') — prevents reCAPTCHA reload loop; LIVE site (hodclub.in) keeps App Check');
          } else if(APPCHECK_SITE_KEY && APPCHECK_SITE_KEY.length > 10 && firebase.appCheck){
            firebase.appCheck().activate(
              new firebase.appCheck.ReCaptchaEnterpriseProvider(APPCHECK_SITE_KEY),
              true  // isTokenAutoRefreshEnabled
            );
            console.log('✅ App Check active (reCAPTCHA Enterprise)');
          } else {
            console.log('ℹ️ App Check skipped — APPCHECK_SITE_KEY blank');
          }
        }catch(e){ console.warn('App Check init failed (continuing without):', e); }
      }
      firestore = firebase.firestore();
      // 🆕 2026-06-02 — Firestore realtime LISTEN (onSnapshot) over WebChannel can
      // stall ~30s on phones / venue wifi / proxied networks before falling back to
      // long-polling — this is the customer ticket-wallet "takes 30s to load" bug
      // (one-shot get() reads are fast; only the wallet's onSnapshot listener stalls).
      //
      // ⚡ 2026-06-07 v3.210 — auto-detect WASN'T enough: the wallet link is opened
      // INSIDE WhatsApp's in-app browser (a webview that almost always blocks the
      // fast WebChannel stream), and on a COLD deep-link the wallet's onSnapshot is
      // the very FIRST Firestore read — so auto-detect spends 10-15s *detecting*
      // that WebChannel is buffered before it falls back. That detection latency IS
      // the "QR takes 10-15s to load" the customer sees. Forcing long-polling skips
      // the detection entirely → the first read goes straight to the reliable
      // channel → the QR paints in ~1-2s. Trade-off: marginally more overhead on a
      // perfect open-Chrome network, but this venue's traffic is almost entirely
      // WhatsApp/Instagram webviews where long-polling is the correct transport.
      // Money logic untouched. Must be set before any Firestore read.
      // NOTE: no `merge:true` here — it is not a valid Firestore settings field
      // and stricter SDK builds can throw on it, which the catch below would
      // silently swallow → the long-polling fix would never apply.
      try{ firestore.settings({ experimentalForceLongPolling:true }); console.info('✅ Firestore FORCE long-polling ON (webview-safe)'); }catch(_e){ console.warn('Firestore settings skipped:', _e&&_e.message); }
      firebase.auth().onAuthStateChanged(function(user){
        S._fbUser = user || null;
      });
      DB_MODE = 'firebase';
      // Start persistent real-time events listener ONCE
      // 🔴 2026-05-09 — live OOS + discount overrides from POS Admin → Menu.
      // Keyed by slug(name) so it bridges menu-data.ts ↔ hod-menu.ts ↔ this wallet.
      // Customer sees OOS items disappear and discounts auto-apply (with reason).
      startMenuOverridesListener();
      // 2026-06-14 — LIVE MENU CATEGORIES (admin Menu CRM). One-shot read now + on
      // tab-focus (cheap, menuCategories is tiny & rarely changes). Fail-open.
      _hodLoadLiveCats();
      try{ document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') _hodLoadLiveCats(); }); }catch(_e){}
      // 🆕 2026-06-14 v3.294 (Khushi) — AUTO-REPAINT the open wallet menu when the
      // menu DATA changes. The 30s poll (startMenuOverridesListener replaced the old
      // onSnapshot to kill the "reads in millions" cost) updates window.HOD_*_MENU in
      // the background and fires 'hod-menu-updated' (hash-guarded — ONLY on a real
      // change), but nothing was listening, so a deleted/added item lingered on screen
      // until a manual refresh. This listener repaints the mounted menu the moment a
      // change lands → add/delete now reflect on their own within ≤30s. ZERO new reads
      // (it only re-renders already-fetched data). __rebuildWalletMenu no-ops when the
      // wallet is closed. Debounced so the 3 near-simultaneous food/smoke/bar dispatches
      // collapse into ONE rebuild.
      try{
        if(!window.__hodMenuRepaintBound){
          window.__hodMenuRepaintBound=true; // single-attach guard (init could re-run)
          var _hodMenuRepaintT=null;
          window.addEventListener('hod-menu-updated', function(){
            if(_hodMenuRepaintT) return;
            _hodMenuRepaintT=setTimeout(function(){
              _hodMenuRepaintT=null;
              try{ if(typeof window.__rebuildWalletMenu==='function') window.__rebuildWalletMenu(); }catch(_e){}
            },80);
          });
        }
      }catch(_e){}
      console.log('✅ Firebase connected — real-time database active');
    } else if(typeof firebase === 'undefined'){
      console.log('ℹ️ Firebase SDK not loaded yet — using localStorage');
    }
  }catch(e){console.warn('Firebase init error:',e);}
}

// Minimal render(): wallet.js owns renderWalletPage / renderTopUp and re-calls this
// render() after every onSnapshot update — same contract as index.html's render().
// wallet.js is an IIFE that exposes its render fns on window._renderWalletPage /
// window._renderTopUp (renderWalletPage itself is a closure, NOT a global) — mirror
// exactly how index.html's render() delegates to those exposed globals.
function render(){
  var root=document.getElementById('root'); if(!root) return;
  var fn = (S.view==='topup') ? window._renderTopUp : window._renderWalletPage;
  if(typeof fn!=='function'){ return; } // wallet.js not loaded yet — keep the boot spinner
  try{
    var node = (S.view==='topup')
      ? window._renderTopUp(S._topupBookingId, S._topupDiff||0)
      : window._renderWalletPage(S._walletRef);
    root.replaceChildren(node);
  }catch(e){
    root.innerHTML='<div style="padding:30px;font-family:var(--ff);color:#FF5733;background:#0a0a0a;min-height:100vh;">'
      +'<div style="font-size:16px;font-weight:700;margin-bottom:10px;">Wallet error</div>'
      +'<div style="color:#bbb;font-size:13px;">'+((e&&e.message)||e)+'</div>'
      +'<div style="margin-top:14px;"><a href="https://hodclub.in/" style="color:#FF90E8;">Open HOD home</a></div></div>';
    try{ console.error('wallet render error', e); }catch(_e){}
  }
}

// Wallet module loader (wallet.js is shared verbatim with the full site).
var _walletLoaded=false, _walletLoading=false;
function _loadWalletJs(cb){
  if(_walletLoaded){ cb&&cb(); return; }
  if(_walletLoading) return;
  _walletLoading=true;
  var s=document.createElement('script');
  s.src='wallet.js?v=v3.309';
  s.onload=function(){ _walletLoaded=true; cb&&cb(); };
  s.onerror=function(){
    _walletLoading=false;
    var root=document.getElementById('root');
    if(root) root.innerHTML='<div style="padding:30px;font-family:var(--ff);color:#FF5733;">Could not load wallet. Please check your connection and reload.</div>';
  };
  document.body.appendChild(s);
}

// Deep-link routing — same params index.html honours (?wallet= / ?verify= / ?topup= / ?ref=).
(function(){
  try{
    var p=new URLSearchParams(window.location.search||'');
    if(p.get('topup')){
      S.view='topup'; S._topupBookingId=p.get('topup'); S._topupDiff=parseInt(p.get('diff'))||0;
    } else if(p.get('wallet')){
      S.view='wallet'; S._walletRef=decodeURIComponent(p.get('wallet'));
    } else if(p.get('verify')){
      S.view='wallet'; S._walletRef=decodeURIComponent(p.get('verify'));
    } else if(p.get('ref')){
      S.view='wallet'; S._walletRef=decodeURIComponent(p.get('ref'));
    } else {
      S.view='wallet'; S._walletRef=null; // renderWalletPage shows its own "not found" state
    }
  }catch(e){ S.view='wallet'; S._walletRef=null; }
})();

// Boot: load wallet.js + (re)init Firebase the instant the deferred SDK is ready,
// then render. All paths idempotent (initFirebase no-ops once DB_MODE==='firebase').
function _hodBootFirebase(){
  if(DB_MODE!=='firebase'){
    initFirebase();
  }
  render();
}
_loadWalletJs(function(){ render(); });
initFirebase(); // likely 'local' on first run (deferred SDK not executed yet)
document.addEventListener('DOMContentLoaded', _hodBootFirebase);
window.addEventListener('load', _hodBootFirebase);
</script>
